<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %} – Retkireitit</title>
  <link rel="stylesheet" href="/static/main.css" />
</head>

<body>
  <header>
    <h1><a href="/">Retkireitit</a></h1>
  </header>

  <nav aria-label="Päänavigointi">
    <ul>
      <li><a href="/">Etusivu</a></li>
      <li><a href="/find_route">Haku</a></li>
      {% if session.user_id %}
      <li><a href="/new_route">Lisää reitti</a></li>
      <li>Kirjautunut: {{ session.username }}</li>
      <li>
        <form action="/logout" method="post" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
          <input type="submit" value="Kirjaudu ulos" />
        </form>
      </li>
      {% else %}
      <li><a href="/login">Kirjaudu sisään</a></li>
      <li><a href="/register">Luo tunnus</a></li>
      {% endif %}
    </ul>
  </nav>

  <main>
    {% for message in get_flashed_messages() %}
    <p class="info">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>

</html>
